<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ tema.nombre_tienda }}{% endblock %}</title>
  <style>
    :root { --p: {{ tema.color_primario }}; --s: {{ tema.color_secundario }}; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f6; color: #222; }
    header { background: var(--s); color: #fff; padding: 1rem 1.5rem; }
    header h1 { margin: 0 0 .7rem; font-size: 1.5rem; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem; }
    .btn { display: inline-block; padding: .55rem 1.1rem; border-radius: 6px; background: var(--p); color: #fff;
           text-decoration: none; border: 0; font-size: 1rem; cursor: pointer; }
    nav .btn { background: rgba(255,255,255,.18); }
    nav .btn:hover, .btn:hover { filter: brightness(1.1); }
    nav .admin { background: #fff; color: var(--s); font-weight: 600; margin-left: auto; }
    main { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    .card { background: #fff; border-radius: 10px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .card img, .sinfoto { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; background: #e4e4e4; }
    .sinfoto { display: flex; align-items: center; justify-content: center; color: #888; }
    .precio { font-size: 1.25rem; font-weight: 700; color: var(--s); }
    .msg { background: #dff0d8; padding: .8rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .paginas { display: flex; gap: .5rem; align-items: center; margin-top: 1.5rem; }
    form p { margin: 0 0 1rem; } form input, form textarea { width: 100%; padding: .55rem; font: inherit; }
    .errorlist { color: #b00020; padding-left: 1rem; }
    footer { text-align: center; color: #666; padding: 2rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>{{ tema.nombre_tienda }}</h1>
    <nav>
      <a class="btn" href="{% url 'inicio' %}">Inicio</a>
      <a class="btn" href="{% url 'catalogo' %}">Catálogo</a>
      <a class="btn" href="{% url 'comentarios' %}">Comentarios</a>
      <a class="btn" href="{% url 'comentario_nuevo' %}">Enviar comentario</a>
      <a class="btn admin" href="{% url 'admin:index' %}">Sitio administrativo</a>
    </nav>
  </header>
  <main>
    {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
  <footer>{{ tema.nombre_tienda }}{% if tema.telefono_tienda %} · Tel. {{ tema.telefono_tienda }}{% endif %}</footer>
</body>
</html>
