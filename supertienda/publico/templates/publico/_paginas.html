{% if pagina.has_other_pages %}
<div class="paginas">
  {% if pagina.has_previous %}<a class="btn" href="?page={{ pagina.previous_page_number }}">« Anterior</a>{% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a class="btn" href="?page={{ pagina.next_page_number }}">Siguiente »</a>{% endif %}
</div>
{% endif %}
